# Projects shown on the /projects/ page.
# ----------------------
# Each entry renders as a card: image on the left, text on the right.
#
# A project entry can include:
#   image        – filename inside assets/img/projects/ (use ASCII names)
#   title        – project title
#   meta         – optional one-line subtitle (role, venue, date, status…)
#   url          – optional link; if set, the title and image link out
#   description  – the write-up (supports multiple sentences)
#
# To add a project:
#   1. Drop the image in assets/img/projects/.
#   2. Append a new item to the `projects:` list below.

projects:
  - image: project2.png
    title: Project title
    meta: 
    url:
    description: >-
      Built a genome-wide imaging genetics pipeline integrating 170,566 coding variants, 
      1,425 MRI phenotypes, and disease GWAS datasets to identify brain-related risk genes 
      and quantify genetic correlations with neuropsychiatric disorders.  