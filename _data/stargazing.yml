# Stargazing data
# ----------------
# The page renders the sections below in order (grouped by type of shot).
# Each section holds a list of `items`.
#
# An item can include:
#   image            – photo filename inside assets/img/stargazing/ (use ASCII names)
#   video + poster   – for a clip instead of a photo: the .mp4 filename and the
#                      still image shown before it plays (both in assets/img/stargazing/)
#   title_zh / title_en
#   location_zh / location_en
#   time_zh / time_en
#   gear_zh / gear_en           (器材和拍摄参数; the line is left out if both are missing)
#   description_zh / description_en
#
# A section with an empty `items: []` list renders a "to be photographed" note.
#
# To add a new item:
#   1. Drop the file in assets/img/stargazing/ (ASCII filename like "meteor-02.jpg").
#      Browsers can show .jpg / .png / .webp photos and H.264 .mp4 videos.
#      Camera RAW files (.NEF etc.) must be exported to .jpg first.
#   2. Append a new item under the appropriate section's `items:` list.

# Preface text shown above the table of contents.
preface_zh: >-
  2026年八月，英仙座流星雨。
preface_en: >-
  Perseid meteor shower, August 2026.

sections:
  - id: milky-way
    title_zh: 银河
    title_en: Milky Way
    items:
      # source: data/stars/8326.JPG (no capture date in the file; month assumed
      # from the other three shots — change it if this one is from another trip)
      - image: milky-way-01.jpg
        title_zh: 夏季银河：大三角
        title_en: "Summer Milky Way: the Summer Triangle"
        location_zh: 美国宾夕法尼亚州 Cherry Springs 州立公园
        location_en: Cherry Springs State Park, PA, USA
        time_zh: 2026年八月
        time_en: August 2026
        gear_zh: iPhone · 24mm（等效）· f/1.78 · 10s · ISO 10000
        gear_en: iPhone · 24mm (equiv.) · f/1.78 · 10s · ISO 10000
        description_zh: >-
          在Cherry Springs 州立公园和朋友们躺在地上，一边问ChatGPT一边找到了在大裂缝中的织女星，牛郎星，天津四构成的醒目的夏季银河大三角，以及其他各种各样的星座。第一次观察到了模模糊糊的，不仔细看会以为是云雾的英仙座，看到了银河像一道蒸汽一样从茶壶一样的人马座蒸腾起来。可惜照片里面噪点太多了，很难看清楚银河的细节。希望下次能拍到更像肉眼能观察到的银河照片。
        description_en: >-
          Lying on the ground with friends at Cherry Springs State Park, asking
          ChatGPT as we went, we found the striking Summer Triangle of the summer
          Milky Way, formed by Vega, Altair and Deneb in the Great Rift, along with
          all sorts of other constellations. For the first time I made out Perseus,
          so faint and hazy that you could take it for cloud or mist if you didn't
          look closely, and watched the Milky Way rise like a wisp of steam from
          the teapot of Sagittarius. Sadly the photo is too noisy to show much of
          the Milky Way's detail. Next time I hope to take a Milky Way photo that
          is closer to what the naked eye can see.

      # source: data/stars/457_raw.MP4 (created 2026-08-15 01:22), re-encoded to a
      # web-friendly 1600px H.264 .mp4; the file carries no camera information
      - video: timelapse-01.mp4
        poster: timelapse-01-poster.jpg
        title_zh: 银河延时
        title_en: Milky Way time-lapse
        location_zh: 美国宾夕法尼亚州 Cherry Springs 州立公园
        location_en: Cherry Springs State Park, PA, USA
        time_zh: 2026年八月
        time_en: August 2026
        gear_zh: 大疆
        gear_en: DJI
        description_zh: >-
          朋友用大疆拍到的银河延时摄影，拍摄时间大约是凌晨一点到两点半。看到银河从地平线升起，到慢慢在天上成为一个拱形，罩在所有人头顶上。看着银河中心，想象着地球在遥远旋臂上慢慢地走着，非常震撼。
        description_en: >-
          A Milky Way time-lapse a friend shot on a DJI, from about 1:00 to 2:30
          a.m. We watched the Milky Way rise from the horizon and slowly become an
          arch across the sky, covering everyone's heads. Looking toward the
          galactic center and imagining the Earth slowly making its way along a
          distant spiral arm was awe-inspiring.

  - id: star-trails
    title_zh: 星轨
    title_en: Star trails
    items:
      # source: data/stars/R0010889.JPG (taken 2026-08-15 04:05)
      - image: star-trails-01.jpg
        title_zh: 沾满露水的草地上拍到的星轨
        title_en: Star trails from dew-soaked grass
        location_zh: 美国宾夕法尼亚州 Cherry Springs 州立公园
        location_en: Cherry Springs State Park, PA, USA
        time_zh: 2026年八月
        time_en: August 2026
        gear_zh: Ricoh GR II · 18.3mm · f/2.8 · 单张 20s · ISO 800
        gear_en: Ricoh GR II · 18.3mm · f/2.8 · 20s per frame · ISO 800
        description_zh: >-
          第一次拍摄星轨照片，在住宿的地方附近架起了三脚架，让相机自动抓拍了大约四个小时。第二天起来发现相机沾满了露水，下次拍冬季星轨要记得带一个防水罩。
        description_en: >-
          My first star-trail photo. I set up a tripod near where we were staying
          and let the camera shoot on its own for about four hours. The next
          morning I found the camera covered in dew — next time, for winter star
          trails, I need to remember to bring a rain cover.

  - id: meteors
    title_zh: 流星
    title_en: Meteors
    items:
      # source: data/stars/DSC_1410.NEF (taken 2026-08-15 22:03); the .jpg is the
      # camera's own full-size rendering stored inside the RAW file, unedited
      - image: meteor-01.jpg
        title_zh: 英仙座流星（疑似）
        title_en: Perseid meteor (probably)
        location_zh: 美国宾夕法尼亚州 Cherry Springs 州立公园
        location_en: Cherry Springs State Park, PA, USA
        time_zh: 2026年八月
        time_en: August 2026
        gear_zh: Nikon D7500 · 24mm · f/2.8 · 10s · ISO 3200
        gear_en: Nikon D7500 · 24mm · f/2.8 · 10s · ISO 3200
        description_zh: >-
          不是一颗卫星因为它不是一条笔直的线；应该是一颗流星因为线条头细尾粗，同时尾巴上的光点很大很闪。当天还看到了火流星，如果能拍到的话会是一个有颜色的光电弧。
        description_en: >-
          It isn't a satellite, because the streak isn't a straight line; it should
          be a meteor, because the streak is thin at the head and thick at the
          tail, and the point of light at the tail is big and bright. We also saw
          a fireball that night — had I caught it on camera, it would have been a
          colored arc of light.
